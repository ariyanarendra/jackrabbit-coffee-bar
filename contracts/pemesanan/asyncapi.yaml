asyncapi: 3.1.0

info:
  title: Event Layanan Pemesanan Jackrabbit Coffee Bar
  version: 1.0.0
  description: >
    Kontrak event yang diterbitkan Layanan Pemesanan melalui RabbitMQ
    dan dikonsumsi oleh Layanan Operasional.

servers:
  rabbitmqLocal:
    host: localhost:5672
    protocol: amqp
    description: RabbitMQ untuk lingkungan pengembangan lokal.

channels:
  pesananDikonfirmasi:
    address: pesanan.dikonfirmasi
    description: >
      Routing key untuk event pesanan yang berhasil dikonfirmasi
      setelah stok Inventori dikurangi.
    messages:
      pesananDikonfirmasi:
        $ref: '#/components/messages/PesananDikonfirmasi'
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: pesanan.events
          type: topic
          durable: true
          autoDelete: false
        bindingVersion: 0.3.0

operations:
  terbitkanPesananDikonfirmasi:
    action: send
    summary: Layanan Pemesanan menerbitkan event pesanan dikonfirmasi.
    channel:
      $ref: '#/channels/pesananDikonfirmasi'
    messages:
      - $ref: '#/channels/pesananDikonfirmasi/messages/pesananDikonfirmasi'

  terimaPesananDikonfirmasi:
    action: receive
    summary: Layanan Operasional menerima event pesanan dikonfirmasi.
    channel:
      $ref: '#/channels/pesananDikonfirmasi'
    messages:
      - $ref: '#/channels/pesananDikonfirmasi/messages/pesananDikonfirmasi'

components:
  messages:
    PesananDikonfirmasi:
      name: PesananDikonfirmasi
      title: Pesanan dikonfirmasi
      summary: >
        Pesanan telah dikonfirmasi dan stok Inventori sudah berhasil
        dikurangi.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/PesananDikonfirmasiEvent'

  schemas:
    PesananDikonfirmasiEvent:
      type: object
      additionalProperties: false
      required:
        - event_id
        - event_name
        - occurred_at
        - data
      properties:
        event_id:
          type: string
          format: uuid
          description: Identitas unik event untuk proses idempoten.
          examples:
            - 9bdb7771-c4c5-4eca-ab7d-4420be544229
        event_name:
          type: string
          const: PesananDikonfirmasi
          description: Nama tetap event.
        occurred_at:
          type: string
          format: date-time
          description: Waktu event diterbitkan dalam format ISO 8601.
          examples:
            - '2026-10-31T03:18:12+00:00'
        data:
          $ref: '#/components/schemas/PesananDikonfirmasiData'

    PesananDikonfirmasiData:
      type: object
      additionalProperties: false
      required:
        - kode_pesanan
        - kanal
        - nama_pelanggan
        - status
        - total
        - items
      properties:
        kode_pesanan:
          type: string
          examples:
            - PSN-E2E-0001
        kanal:
          type: string
          examples:
            - grabfood
        nama_pelanggan:
          type: string
          examples:
            - Andi
        status:
          type: string
          const: dikonfirmasi
        total:
          type: integer
          minimum: 0
          examples:
            - 50000
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/PesananItem'

    PesananItem:
      type: object
      additionalProperties: false
      required:
        - kode_menu
        - nama_menu
        - jumlah
        - harga_satuan
        - subtotal
      properties:
        kode_menu:
          type: string
          examples:
            - MNU-001
        nama_menu:
          type: string
          examples:
            - Cafe Latte
        jumlah:
          type: integer
          minimum: 1
          examples:
            - 2
        harga_satuan:
          type: integer
          minimum: 0
          examples:
            - 25000
        subtotal:
          type: integer
          minimum: 0
          examples:
            - 50000